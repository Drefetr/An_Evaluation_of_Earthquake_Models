name: Publish research documents
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -B scripts/verify_repository.py
      - run: python -B scripts/verify_claims.py
      - run: python -B website/build_site.py --output build/site
      - run: node website/check_interactions.cjs build/site
      - name: Publish the verified bundle to gh-pages
        id: publication
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGES_ARTIFACT: ${{ runner.temp }}/artifact.tar
        run: python -B scripts/publish_pages.py --bundle build/site --source-sha "$SOURCE_SHA" --output build/pages-published --artifact "$PAGES_ARTIFACT"
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the same published tree
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report Pages deployment diagnostics
        if: failure() && steps.deployment.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          for endpoint in ['/pages', '/pages/deployments/' + os.environ['GITHUB_SHA']]:
              request = urllib.request.Request(base + endpoint, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
                  if endpoint == '/pages':
                      data = {key: data.get(key) for key in ['status', 'build_type', 'source', 'html_url', 'cname']}
                  print(endpoint + ': ' + json.dumps(data))
              except urllib.error.HTTPError as error:
                  print(endpoint + ': HTTP ' + str(error.code) + ' ' + error.read().decode('utf-8'))
          PY

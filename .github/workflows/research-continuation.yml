name: Reviewed research continuation
on:
  push:
    branches: ['research/joint_replay_20261107T045457Z-integration']
permissions:
  contents: read
  actions: read
concurrency:
  group: reviewed-research-continuation
  cancel-in-progress: false
jobs:
  continuation:
    if: contains(github.event.head_commit.message, '[run-continuation]')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ contains(github.event.head_commit.message, '[joint-host]') && 240 || 290 }}
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      CONTINUATION_HOST_TIMEOUT_MINUTES: ${{ contains(github.event.head_commit.message, '[joint-host]') && '240' || '290' }}
    steps:
      - name: Record host start before setup
        run: echo "CONTINUATION_HOST_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.18'
          cache: pip
      - run: python -m pip install -r requirements-cpu.txt
      - name: Validate admission and nonduplicate replay rosters
        run: python -B -m unittest discover -s tests -p test_continuation_controller.py -v
      - name: Validate joint likelihood derivatives and selection controls on Linux
        run: python -B -m unittest discover -s tests -p test_s04b_joint_nuisance.py -v
      - name: Validate ordered native scheduling and exact checkpoint continuation on Linux
        run: |
          python -B - <<'PY'
          import json, subprocess, sys
          with open('validation/reproductions/continuation_20261107/dispatch.json') as stream:
              stage = json.load(stream)['stage']
          if stage in ('joint-continuation-pilot', 'joint-continuation-campaign', 'joint-budgeted-case', 'joint-budgeted-host', 'joint-recovery-host', 'joint-remaining-host'):
              for pattern in ('test_joint_parallel_chunks.py', 'test_joint_execution_driver.py'):
                  subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-p', pattern, '-v'], check=True)
          if stage in ('joint-budgeted-case', 'joint-budgeted-host'):
              subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_joint_budgeted_driver.py', '-v'], check=True)
          if stage == 'joint-budgeted-host':
              for pattern in ('test_joint_budgeted_batch.py', 'test_joint_saved_output_audit.py'):
                  subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-p', pattern, '-v'], check=True)
          if stage == 'joint-recovery-host':
              for pattern in ('test_joint_recovery*.py', 'test_joint_saved_output_audit.py'):
                  subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-p', pattern, '-v'], check=True)
          if stage == 'joint-remaining-host':
              for pattern in ('test_joint_remaining*.py', 'test_joint_saved_output_audit.py'):
                  subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'tests', '-p', pattern, '-v'], check=True)
          PY
      - name: Verify Linux process containment before scientific execution
        env:
          SUPERVISOR_TEST_OUTPUT: ${{ runner.temp }}/continuation-preflight
        run: python -B -m unittest discover -s scripts/tests -p test_supervise_research_linux.py -v
      - name: Retain process-lifetime controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuation-preflight-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/continuation-preflight
          if-no-files-found: error
      - name: Supervised source-pinned scientific stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/run_continuation.py --admission validation/reproductions/continuation_20261107/dispatch.json --output "$RUNNER_TEMP/continuation"
      - name: Preserve successes, failures, partial rows, and build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/continuation/**/result.json
            ${{ runner.temp }}/continuation/**/launch.json
            ${{ runner.temp }}/continuation/**/progress.jsonl
            ${{ runner.temp }}/continuation/**/native_components.npz
            ${{ runner.temp }}/continuation/science/rows/**/*.json
            ${{ runner.temp }}/continuation/science/*.json
            ${{ runner.temp }}/continuation/science/*.jsonl
            ${{ runner.temp }}/continuation/science/cases/**
            ${{ runner.temp }}/continuation/science/attempts/**
            ${{ runner.temp }}/continuation/science/reviews/**
            ${{ runner.temp }}/continuation/science/training_resume/**
            ${{ runner.temp }}/continuation/science/transition/**
            ${{ runner.temp }}/continuation/*.json
            ${{ runner.temp }}/continuation/original_failure.zip
            ${{ runner.temp }}/continuation/supervision/*.json
            ${{ runner.temp }}/continuation/supervision/*.log
            ${{ runner.temp }}/continuation/build/**
            ${{ runner.temp }}/continuation/host/**
            ${{ runner.temp }}/continuation/reader/*.json
            ${{ runner.temp }}/continuation/reader/build/**
            ${{ runner.temp }}/continuation/reader/supervision/*.json
            ${{ runner.temp }}/continuation/reader/supervision/*.log
            ${{ runner.temp }}/continuation/reader/science/*.json
            ${{ runner.temp }}/continuation/reader/science/*.jsonl
            ${{ runner.temp }}/continuation/reader/science/rows/**/result.json
            ${{ runner.temp }}/continuation/reader/science/rows/**/native_components.npz
          if-no-files-found: warn

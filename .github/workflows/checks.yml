name: Deterministic CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m unittest discover -s reproduction/regional/tests -v
      - run: python -B reproduction/regional/inputs.py verify
      - run: python -B -m unittest discover -s reproduction/s02 -p test_inputs.py -v
      - run: python -B reproduction/s02/inputs.py verify
      - run: python -B reproduction/historical_fits/verify.py
      - run: python -B -m unittest discover -s engine/stage2_followup/tests -v
      - run: python -B scripts/check_mathematics.py --output build/mathematics.json
      - run: python -B scripts/verify_claims.py
      - run: python -B scripts/verify_repository.py
      - run: node website/check_interactions.cjs

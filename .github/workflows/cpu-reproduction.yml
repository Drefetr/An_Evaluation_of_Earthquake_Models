name: Portable CPU kernel acceptance

on:
  push:
    branches:
      - 'research/**'
    paths:
      - 'engine/**'
      - 'reproduction/**'
      - 'tests/test_cpu_portability.py'
      - 'requirements*.txt'
      - 'MANIFEST.json'
      - 'scripts/reproduce_cpu.py'
      - 'scripts/fit_joint_cpu.py'
      - '.github/workflows/cpu-reproduction.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: Bounded check stage (no scientific campaigns)
        type: choice
        default: all
        options: [all, build, stage2, iteration27]

permissions:
  contents: read

jobs:
  cpu-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Record clean checkout and install CPU dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cpu-checkout"
          git rev-parse HEAD | tee "$RUNNER_TEMP/cpu-checkout/commit.txt"
          git status --porcelain | tee "$RUNNER_TEMP/cpu-checkout/status_before.txt"
          test ! -s "$RUNNER_TEMP/cpu-checkout/status_before.txt"
          python -m pip install -r requirements-cpu.txt 2>&1 | tee "$RUNNER_TEMP/cpu-checkout/dependencies.log"
      - name: Confirm clean CPU environment has no PyTorch dependency
        run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - name: Run actual CPU kernels and bounded assertions
        env:
          CHECK_STAGE: ${{ inputs.stage || 'all' }}
        run: python -B -m engine.cpu_reproduction --stage "$CHECK_STAGE" --output "$RUNNER_TEMP/cpu-core"
      - name: Test source-preserving generic compiler route
        run: python -B -m unittest discover -s tests -p test_cpu_portability.py -v
      - name: Test Linux research-child containment with tiny process fixtures
        env:
          SUPERVISOR_TEST_OUTPUT: ${{ runner.temp }}/cpu-core/supervisor
        run: python -B -m unittest discover -s scripts/tests -p test_supervise_research_linux.py -v
      - name: Verify supplied scientific inputs
        run: |
          set -euo pipefail
          python -B reproduction/regional/inputs.py verify 2>&1 | tee "$RUNNER_TEMP/cpu-checkout/regional_inputs.log"
          python -B reproduction/s02/inputs.py verify 2>&1 | tee "$RUNNER_TEMP/cpu-checkout/s02_inputs.log"
          python -B reproduction/historical_fits/verify.py 2>&1 | tee "$RUNNER_TEMP/cpu-checkout/historical_fits.log"
      - name: Check public CPU commands and constructed continuation controls
        run: |
          set -euo pipefail
          python -B scripts/reproduce_cpu.py --help 2>&1 | tee "$RUNNER_TEMP/cpu-checkout/replay_help.log"
          python -B scripts/fit_joint_cpu.py --help 2>&1 | tee "$RUNNER_TEMP/cpu-checkout/joint_help.log"
          python -B -m unittest discover -s tests -p test_continuation_controller.py -v 2>&1 | tee "$RUNNER_TEMP/cpu-checkout/continuation_controls.log"
          python -B -m unittest discover -s tests -p test_joint_cpu_reader.py -v 2>&1 | tee "$RUNNER_TEMP/cpu-checkout/joint_reader_controls.log"
      - name: Verify claim and repository custody
        run: |
          set -euo pipefail
          python -B scripts/verify_claims.py 2>&1 | tee "$RUNNER_TEMP/cpu-checkout/claims.log"
          python -B scripts/verify_repository.py 2>&1 | tee "$RUNNER_TEMP/cpu-checkout/repository.log"
      - name: Confirm verification left the checkout clean
        run: |
          set -euo pipefail
          git status --porcelain | tee "$RUNNER_TEMP/cpu-checkout/status_after.txt"
          test ! -s "$RUNNER_TEMP/cpu-checkout/status_after.txt"
      - name: Retain CPU execution receipt, source hashes, and compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-core-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cpu-core
            ${{ runner.temp }}/cpu-checkout
          if-no-files-found: error
